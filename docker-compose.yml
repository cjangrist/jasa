# Copy .env.example to .env, configure the desired providers, then run:
# docker compose up -d --build --wait
services:
  jasa:
    build: .
    image: jasa:local
    env_file:
      - path: .env
        required: false
    ports:
      - "${JASA_DOCKER_HOST:-127.0.0.1}:${JASA_DOCKER_PORT:-8000}:8000"
    environment:
      JASA_CACHE_BACKEND: disk
      JASA_DISK_CACHE_PATH: /home/app/.cache/jasa
    volumes:
      - jasa-cache:/home/app/.cache/jasa
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    restart: unless-stopped

volumes:
  jasa-cache:
