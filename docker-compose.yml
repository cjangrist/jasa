# Copy .env.example to .env, configure the desired providers, then run:
# docker compose up -d --build --wait
services:
  jasa:
    build: .
    image: jasa:local
    env_file:
      - path: ${COMPOSE_ENV_FILES:-.env}
        required: false
        format: raw
    environment:
      - JASA_TRACE_S3_ENABLED
      - JASA_TRACE_S3_ENDPOINT
      - JASA_TRACE_S3_REGION
      - JASA_TRACE_S3_BUCKET
      - JASA_TRACE_S3_PREFIX
      - JASA_TRACE_S3_ACCESS_KEY_ID
      - JASA_TRACE_S3_SECRET_ACCESS_KEY
      - JASA_TRACE_S3_FORCE_PATH_STYLE
      - JASA_TRACE_S3_QUEUE_CAPACITY
    ports:
      - "${JASA_DOCKER_HOST:-127.0.0.1}:${JASA_DOCKER_PORT:-8000}:8000"
    volumes:
      - jasa-cache:/home/app/.cache/jasa
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    restart: unless-stopped

volumes:
  jasa-cache:
