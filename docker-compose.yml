# Run with Doppler-injected secrets:  doppler run -- docker compose up -d
# Environment entries name secrets only (no =value); Doppler supplies values at
# up/run time. Logs/exec use plain `docker compose` commands.
services:
  jasa:
    build: .
    image: jasa:local
    ports:
      - "${JASA_DOCKER_HOST:-127.0.0.1}:${JASA_DOCKER_PORT:-8000}:8000"
    environment:
      # Composed-mode default: jasa owns POST /fetch; gate the child's mirror off.
      - OMNIFETCH_REST_WEB_FETCH
      # REST authentication. JASA_API_KEY wins over the legacy aliases.
      - JASA_API_KEY
      - OPENWEBUI_API_KEY
      - OMNISEARCH_API_KEY
      - JASA_LOG_LEVEL
      - JASA_CACHE_BACKEND
      - JASA_REDIS_URL
      # Search-provider secrets (jasa search family).
      - TAVILY_API_KEY
      - BRAVE_API_KEY
      - KAGI_API_KEY
      - EXA_API_KEY
      - FIRECRAWL_API_KEY
      - PERPLEXITY_API_KEY
      - SERPAPI_API_KEY
      - LINKUP_API_KEY
      - YOU_API_KEY
      - PARALLEL_API_KEY
      - CEREBRAS_API_KEY
      # Fetch-provider secrets (mounted omnifetch family). Shared credentials
      # (TAVILY/FIRECRAWL/LINKUP/YOU/SERPAPI) appear once and enable both.
      - BRIGHT_DATA_API_KEY
      - DECODO_WEB_SCRAPING_API_KEY
      - DIFFBOT_TOKEN
      - GITHUB_API_KEY
      - JINA_API_KEY
      - KIMI_API_KEY
      - LEADMAGIC_API_KEY
      - OLOSTEP_API_KEY
      - OPENGRAPH_IO_API_KEY
      - OXYLABS_WEB_SCRAPER_USERNAME
      - OXYLABS_WEB_SCRAPER_PASSWORD
      - SCRAPE_DO_API_TOKEN
      - SCRAPEGRAPHAI_API_KEY
      - SCRAPELESS_API_KEY
      - SCRAPERAPI_API_KEY
      - SCRAPFLY_API_KEY
      - SCRAPINGANT_API_KEY
      - SCRAPINGBEE_API_KEY
      - SCRAPPEY_API_KEY
      - SOCIAVAULT_API_KEY
      - SPIDER_CLOUD_API_TOKEN
      - SUPADATA_API_KEY
      - ZYTE_API_KEY
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
