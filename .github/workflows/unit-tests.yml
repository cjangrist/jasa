name: Unit Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen --extra telemetry
      - name: Run unit tests and collect coverage
        run: >-
          uv run pytest
          --junitxml=junit.xml
          --cov-fail-under=0
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unit-test-results
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: error

  coverage-gate:
    name: coverage-gate
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unit-test-results
          path: test-artifacts
      - name: Enforce complete line and branch coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path("test-artifacts/coverage.xml")
          root = ElementTree.parse(report).getroot()
          lines_valid = int(root.attrib["lines-valid"])
          lines_covered = int(root.attrib["lines-covered"])
          branches_valid = int(root.attrib["branches-valid"])
          branches_covered = int(root.attrib["branches-covered"])
          print(f"lines: {lines_covered}/{lines_valid}")
          print(f"branches: {branches_covered}/{branches_valid}")
          if lines_covered != lines_valid or branches_covered != branches_valid:
              raise SystemExit("minimum coverage is 100% for lines and branches")
          PY
