name: Docker Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-tests:
    name: docker-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Build and probe the Docker image
        env:
          JASA_RUN_DOCKER_TESTS: "1"
        run: uv run pytest -m docker_integration --no-cov

